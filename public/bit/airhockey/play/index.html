<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>AIR HOCKEY</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="view"></canvas>
<button id="sound" class="sound" aria-pressed="true">♪ ON</button>
<button id="pause" class="pause" aria-label="ポーズ" hidden><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="1.5" width="2.8" height="9" rx=".6"/><rect x="7.2" y="1.5" width="2.8" height="9" rx=".6"/></svg></button>
<!-- call-outs: one per player; in 2P each sits in its player's half, turned to face them -->
<div class="bslot s1"><div class="rot"><div id="banner" class="banner" aria-live="polite"></div></div></div>
<div class="bslot s2"><div class="rot"><div id="banner2" class="banner"></div></div></div>

<div id="menu" class="overlay">
 <!-- one screen at a time: top, then a stage (CPU), then its level and points, then START -->
 <div class="card" data-screen="top">
  <h1>AIR HOCKEY</h1>
  <div class="levels" style="margin-top:20px">
   <button data-go="cpu">CPU対戦</button>
  </div>
  <div id="vs-box" class="vs-box">
   <button id="vs">2人対戦</button>
   <p id="vs-hint" class="hint">1台を平らに置いて向かい合い、自分側の半分を指で操作</p>
   <button id="watch" class="watch">エキシビジョンマッチ</button>
   <p class="note">CPU同士の対戦を見る</p>
  </div>
 </div>
 <div class="card" data-screen="cpu" hidden>
  <h2>CPU対戦</h2>
  <div class="levels" style="margin-top:18px">
   <button data-go="arcade">ARCADE</button>
   <p class="note">ゲームセンターのあの台</p>
   <button data-go="pro">PRO STAGE</button>
   <p class="note">本物の球速、公式のルール</p>
  </div>
  <button class="back" data-go="top">← もどる</button>
 </div>
 <div class="card" data-screen="arcade" hidden>
  <h2>ARCADE</h2>
  <div class="modes pick" data-pick="level">
   <button data-v="0">EASY</button><button data-v="1" class="on">NORMAL</button><button data-v="2">HARD</button>
  </div>
  <div class="modes pick" data-pick="win">
   <div><button data-v="7" class="on">7点先取</button></div>
   <div><button data-v="15">15点先取</button><p class="note">途中でパックが増える</p></div>
  </div>
  <div class="levels"><button class="primary" data-start="arcade">START</button></div>
  <button class="back" data-go="cpu">← もどる</button>
 </div>
 <div class="card" data-screen="pro" hidden>
  <h2>PRO STAGE</h2>
  <div class="modes pick" data-pick="level">
   <button data-v="4" class="on">ELITE</button><button data-v="5">CHAMPION</button><button data-v="6">LEGEND</button>
  </div>
  <div class="modes pick" data-pick="games">
   <button data-v="1" class="on">1ゲーム</button><button data-v="4">公式ルール</button>
  </div>
  <p class="note" style="margin:-4px 0 12px">公式ルール＝7点×4ゲーム先取</p>
  <div class="levels"><button class="primary" data-start="pro">START</button></div>
  <button class="back" data-go="cpu">← もどる</button>
 </div>
 <div class="card" data-screen="two" hidden>
  <h2>2人対戦</h2>
  <div class="modes pick" data-pick="win">
   <div><button data-v="7" class="on">7点先取</button></div>
   <div><button data-v="15">15点先取</button><p class="note">途中でパックが増える</p></div>
  </div>
  <div class="levels"><button class="primary" data-start="two">START</button></div>
  <button class="back" data-go="top">← もどる</button>
 </div>
</div>

<div id="pausemenu" class="overlay hidden">
 <div class="card">
  <h2>PAUSE</h2>
  <div class="levels" style="margin-top:18px">
   <button id="resume" class="primary">つづける</button>
   <button id="pause-menu">メニューへ</button>
  </div>
 </div>
</div>

<div id="result" class="overlay hidden">
 <div class="card">
  <h2 id="result-title">YOU WIN</h2>
  <p id="result-mode" class="rmode"></p>
  <p id="result-score" class="score"></p>
  <p id="result-sub" class="note" style="margin:-10px 0 14px" hidden></p>
  <div class="levels">
   <button id="again" class="primary">もう一度</button>
   <button id="back">難易度を選ぶ</button>
   <button id="title">タイトルに戻る</button>
  </div>
  <button id="share" class="share">X SHARE</button>
 </div>
</div>

<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module" src="game.js"></script>
</body></html>
