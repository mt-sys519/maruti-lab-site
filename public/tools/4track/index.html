<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#E7E2D3;color:#141B24;
  font-family:'Segoe UI',system-ui,sans-serif;font-size:12px;
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
  user-select:none;
}

/* ── Toolbar ─────────────────────────────── */
#toolbar{
  background:linear-gradient(180deg,#EEF0EA,#D8D0BA 100%);
  border-bottom:2px solid #141B24;
  padding:10px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0;min-height:80px;flex-wrap:wrap;row-gap:8px;
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.3);
}
#toolbar h1{display:flex;align-items:center;gap:10px;white-space:nowrap;margin-right:6px;}
#toolbar h1 .logo-icon-svg{height:52px;width:auto;display:block;flex-shrink:0;}
#toolbar h1 .logo-text{display:flex;flex-direction:column;line-height:1.15;}
#toolbar h1 .logo-title{font-family:'Courier New',monospace;font-size:21px;font-weight:900;letter-spacing:1px;color:#141B24;}
#toolbar h1 .logo-sub{font-family:'Courier New',monospace;font-size:12px;font-weight:700;letter-spacing:1.2px;color:#C24B3A;}
.sep{width:1px;height:44px;background:#141B24;margin:0 2px;flex-shrink:0;}

#toolbar .btn{padding:12px 22px;font-size:15px;font-weight:600;border-radius:8px;box-shadow:3px 3px 0 #141B24;}
#toolbar .btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 #141B24}
#toolbar .btn.active{transform:translate(3px,3px);box-shadow:0 0 0 #141B24}
#toolbar .if label{font-size:11px;}
#toolbar .if input[type=number]{width:58px;font-size:16px;font-weight:700;padding:7px 5px;}
#status{
  margin-left:auto;color:#5C6B76;font-size:12px;
  max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ── Master / LO-FI (toolbar) ────────────── */
#master-box{display:flex;align-items:center;gap:10px;padding:8px 14px;border:1px solid #3D5165;border-radius:8px;background:#22384C;min-height:60px;}
#master-box .mb-label{font-family:'Courier New',monospace;font-size:11px;font-weight:700;color:#5FAE9D;letter-spacing:1px;}
#master-box input[type=range]{accent-color:#5FAE9D;width:84px;height:20px;cursor:pointer;}
.master-vol-val{font-family:'Courier New',monospace;font-size:11px;font-weight:700;color:#E7E2D3;min-width:36px;}
.eq-select-master{
  background:#1C2B3A;border:1px solid #3D5165;color:#E7E2D3;
  padding:6px 8px;border-radius:6px;font-size:12px;cursor:pointer;
}
.meter-wrap{width:96px;height:28px;background:#17222E;border:1px solid #000;border-radius:3px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.7);position:relative;}
.meter-fill{
  height:100%;width:0%;
  background:
    repeating-linear-gradient(90deg, transparent 0px, transparent 3px, rgba(29,22,14,.9) 3px, rgba(29,22,14,.9) 4px),
    linear-gradient(90deg,#3FA34D,#F0B429 75%,#D94F3D 92%);
}
.meter-wrap::after{content:'';position:absolute;top:0;bottom:0;left:75%;width:1px;background:rgba(255,255,255,.55);pointer-events:none;}
.clip-lamp{
  width:18px;height:18px;border-radius:50%;background:#3a1512;border:1px solid #000;
  box-shadow:inset 0 0 2px rgba(0,0,0,.8);flex-shrink:0;
}
.clip-lamp.on{background:#ff4433;box-shadow:0 0 6px #ff4433,inset 0 0 2px rgba(0,0,0,.5);}

#metronome-box{display:flex;align-items:center;gap:10px;padding:8px 14px;border:1px solid #3D5165;border-radius:8px;background:#22384C;min-height:60px;}
#metronome-box .mb-label{font-family:'Courier New',monospace;font-size:11px;font-weight:700;color:#5FAE9D;letter-spacing:1px;}
.metro-field{display:flex;flex-direction:column;gap:2px;font-size:9px;color:#9FB0BC;letter-spacing:.3px;}
.metro-field input[type=number],.metro-field select{
  background:#22384C;border:1px solid #3D5165;color:#E7E2D3;
  padding:6px 6px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;width:58px;
}
#lofi-box{display:flex;align-items:center;gap:10px;padding:8px 14px;border:1px solid #3D5165;border-radius:8px;background:#22384C;min-height:60px;}
#lofi-box .mb-label{font-family:'Courier New',monospace;font-size:11px;font-weight:700;color:#5FAE9D;letter-spacing:1px;cursor:pointer;}
.knob{
  width:34px;height:34px;border-radius:50%;position:relative;cursor:ns-resize;flex-shrink:0;
  background:radial-gradient(circle at 35% 30%,#6E8494,#17222E 70%);
  border:1px solid #000;box-shadow:0 1px 2px rgba(0,0,0,.6);
}
.knob .tick{position:absolute;top:3px;left:50%;width:2.5px;height:8px;background:#5FAE9D;transform-origin:1.25px 14px;margin-left:-1.25px;border-radius:1.25px;}
.knob-val{font-family:'Courier New',monospace;font-size:11px;color:#9FB0BC;min-width:30px;}
.btn{
  background:#EEF0EA;border:2px solid #141B24;color:#141B24;
  padding:3px 11px;border-radius:6px;cursor:pointer;font-size:11px;
  transition:background .12s,border-color .12s,transform .08s,box-shadow .08s;white-space:nowrap;
  box-shadow:2px 2px 0 #141B24;
}
.btn:hover{background:#D8D0BA}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:0 0 0 #141B24}
.btn:disabled{opacity:.35;cursor:default}
.btn.active{background:#5FAE9D;border-color:#141B24;color:#141B24;font-weight:600;transform:translate(2px,2px);box-shadow:0 0 0 #141B24}
.btn-green{border-color:#3FA34D;color:#3FA34D}
.btn-green:hover{background:#3FA34D;color:#000}
.btn-red{border-color:#D94F3D;color:#D94F3D}
.btn-red:hover{background:#D94F3D;color:#fff}

/* ── Main (top half) ─────────────────────── */
#main{display:flex;flex:0 0 244px;overflow:hidden;min-height:0}

/* Sample panel */
#sample-panel{
  width:196px;flex-shrink:0;background:#E7E2D3;
  border-right:1px solid #141B24;display:flex;flex-direction:column;
}
.ph{
  padding:5px 9px;color:#5C6B76;font-size:10px;
  text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #141B24;flex-shrink:0;
}
#drop-zone{
  border:2px dashed #141B24;border-radius:5px;margin:7px;padding:8px;
  text-align:center;color:#5C6B76;font-size:10px;line-height:1.7;
  cursor:pointer;transition:all .14s;
}
#drop-zone.dov{border-color:#5FAE9D;color:#5FAE9D;background:rgba(255,107,53,.06)}
#sample-list{flex:1;overflow-y:auto;padding:3px}
.si{
  padding:4px 7px;border-radius:4px;cursor:grab;
  border:1px solid transparent;margin-bottom:2px;
}
.si:hover{background:#D8D0BA}
.si.sel{background:#D8D0BA;border-color:#5FAE9D}
.si-name{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si-dur{font-size:10px;color:#5C6B76;margin-top:1px}
.si-wave{width:100%;height:20px;display:block;margin-top:3px;border-radius:2px}

/* Waveform editor */
#editor-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#wv-hd{
  padding:4px 9px;background:#E7E2D3;border-bottom:1px solid #141B24;
  display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap;min-height:30px;
}
#wv-label{color:#5C6B76;font-size:10px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#add-track-sel{
  background:#EEF0EA;border:1px solid #141B24;color:#141B24;
  padding:2px 4px;border-radius:4px;font-size:10px;cursor:pointer;
}
#wv-container{flex:0 0 72px;min-height:0;background:#22384C;display:flex;flex-direction:column;position:relative}
#wv-canvas{display:block;width:100%;flex:1;min-height:0;cursor:crosshair}
#wv-info{
  padding:3px 9px;font-size:10px;color:#5C6B76;
  background:#E7E2D3;border-top:1px solid #141B24;flex-shrink:0;
}

/* ── Tempo (flagship feature) ─────────────── */
#tempo-panel{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex-shrink:0;
  padding:10px 14px;border-bottom:1px solid #3D5165;border-left:4px solid #5FAE9D;
  background:linear-gradient(180deg,rgba(255,107,53,.12),rgba(255,107,53,.03));
}
.tempo-icon{font-size:24px;flex-shrink:0;}
.tempo-fields{display:flex;align-items:flex-end;gap:8px;}
.tempo-fields label{display:flex;flex-direction:column;gap:3px;font-size:9px;color:#5C6B76;letter-spacing:.3px;white-space:nowrap;}
.tempo-fields input[type=number]{
  width:66px;font-size:19px;font-weight:700;text-align:center;
  background:#EEF0EA;border:1px solid #141B24;color:#141B24;border-radius:6px;padding:6px 4px;
}
.tempo-arrow{font-size:19px;color:#5FAE9D;padding-bottom:6px;}
.tempo-apply{
  font-size:14px;font-weight:700;padding:11px 22px;border-radius:7px;
  background:#5FAE9D;border-color:#141B24;color:#141B24;
  box-shadow:3px 3px 0 #141B24;
}
.tempo-apply:hover:not(:disabled){background:#7FC4B4;}
.tempo-apply:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 #141B24}
.tempo-apply:disabled{opacity:1;background:#D8D0BA;border-color:#141B24;color:#7A8D9B;box-shadow:none;}
.tempo-sep{width:1px;height:34px;background:#3D5165;flex-shrink:0;align-self:center;}
.mono-apply{background:#C24B3A;color:#fff;}
.mono-apply:hover:not(:disabled){background:#D66A54;}
.tempo-note{font-size:10px;color:#5C6B76;max-width:260px;line-height:1.5;}

/* ── Timeline (bottom half) ──────────────── */
#tl-outer{
  display:flex;flex-direction:column;flex:1;min-height:0;
  border-top:1px solid #3D5165;
}
#tl-top{display:flex;flex-shrink:0;height:20px;background:#1C2B3A;border-bottom:1px solid #3D5165}
#tl-corner{width:162px;flex-shrink:0;border-right:1px solid #3D5165;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 8px;font-size:9px;color:#6E8494;letter-spacing:.3px}
.zoom-controls{display:flex;gap:3px;}
.zoom-controls button{
  width:16px;height:16px;line-height:14px;padding:0;border:1px solid #3D5165;border-radius:2px;
  background:#1C2B3A;color:#9FB0BC;font-size:10px;font-weight:700;cursor:pointer;
}
.zoom-controls button:hover{border-color:#9FB0BC;color:#E7E2D3}
#ruler-scroll{flex:1;overflow:hidden}
#ruler-canvas{display:block;height:20px}
#tl-body{display:flex;flex:1;overflow:hidden}
#headers-col{
  width:162px;flex-shrink:0;border-right:1px solid #3D5165;
  overflow:hidden;display:flex;flex-direction:column;
}
#headers-inner{flex:1;overflow:hidden}
#clips-scroll{flex:1;overflow:auto;cursor:default;position:relative}
#tl-canvas{display:block}

/* Track header */
.th{
  height:114px;border-bottom:1px solid #3D5165;
  display:flex;flex-direction:row;padding:4px 6px;gap:6px;flex-shrink:0;
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(0,0,0,.12));
}
.th-main{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-width:0;position:relative;}
.th-name{
  font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  cursor:text;min-width:0;
}
.th-name:focus{outline:none;background:#D8D0BA;border-radius:3px;padding:0 2px}
.th-btns{display:flex;gap:4px;align-items:center}
.th-btn{
  padding:2px 6px;border-radius:4px;border:1.5px solid #141B24;background:#EEF0EA;
  color:#5C6B76;font-size:10px;font-weight:700;cursor:pointer;line-height:1.2;
  box-shadow:1.5px 1.5px 0 #141B24;
  transition:background .1s,color .1s,border-color .1s,transform .08s,box-shadow .08s;
}
.th-btn:hover{border-color:#5C6B76;color:#141B24}
.th-btn:active{transform:translate(1.5px,1.5px);box-shadow:0 0 0 #141B24}
.th-btn.muted{background:#A89A7C;border-color:#141B24;color:#000;transform:translate(1.5px,1.5px);box-shadow:0 0 0 #141B24}
.th-btn.soloed{background:#F0B429;border-color:#141B24;color:#000;transform:translate(1.5px,1.5px);box-shadow:0 0 0 #141B24}
.th-btn.rec-armed{background:#D94F3D;border-color:#141B24;color:#fff;animation:recblink .8s ease-in-out infinite;transform:translate(1.5px,1.5px);box-shadow:0 0 0 #141B24}
.th-btn.rec-on{background:#D94F3D;border-color:#141B24;color:#fff;transform:translate(1.5px,1.5px);box-shadow:0 0 0 #141B24}
@keyframes recblink{0%,100%{opacity:1}50%{opacity:.4}}

.modal-overlay{position:fixed;inset:0;background:rgba(20,27,36,.6);display:flex;align-items:center;justify-content:center;z-index:1000;}
.modal-box{background:#EEF0EA;border:2px solid #141B24;border-radius:10px;box-shadow:5px 5px 0 #141B24;padding:22px 26px;max-width:320px;}
.modal-box h3{margin:0 0 10px;font-size:15px;color:#141B24;}
.modal-box p{margin:0 0 18px;font-size:12px;line-height:1.7;color:#5C6B76;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;}
.th-vol-row{display:flex;align-items:center;gap:4px;font-size:10px;color:#5C6B76}
.th-vol-row input[type=range]{width:62px;accent-color:#3FA34D;cursor:pointer}
.th-pan-row{display:flex;align-items:center;gap:4px;font-size:10px;color:#5C6B76}
.th-pan-row input[type=range]{width:62px;accent-color:#5FAE9D;cursor:pointer}
.th-pan-row .pv{min-width:26px;font-size:9px;font-family:'Courier New',monospace;}
.th-eq-row{display:flex;align-items:center;gap:4px;font-size:10px;color:#5C6B76}
.th-eq-row select{
  width:58px;flex-shrink:0;background:#EEF0EA;border:1px solid #141B24;color:#141B24;
  padding:2px 3px;border-radius:3px;font-size:9px;cursor:pointer;
}
.th-level-wrap{flex-shrink:0;display:flex;gap:3px;align-items:flex-end;align-self:stretch;}
.th-level-ch{width:11px;height:100%;background:#D8D0BA;border-radius:2px;overflow:hidden;position:relative;display:flex;align-items:flex-end;}
.th-level-fill{
  width:100%;height:0%;
  background:
    repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(237,224,192,.9) 2px, rgba(237,224,192,.9) 3px),
    linear-gradient(0deg,#3FA34D,#F0B429 75%,#D94F3D 92%);
  transition:height .04s;
}
.th-level-ch::after{content:'';position:absolute;left:0;right:0;bottom:75%;height:1px;background:rgba(43,33,24,.5);pointer-events:none}
.th-rec-time{font-size:10px;color:#D94F3D;font-weight:600;position:absolute;right:6px;top:5px}

/* ── Inspector ───────────────────────────── */
#inspector{
  background:#E7E2D3;border-top:1px solid #141B24;
  padding:5px 12px;display:flex;align-items:center;gap:14px;
  flex-shrink:0;flex-wrap:wrap;min-height:34px;
}
#ins-label{font-size:10px;color:#5C6B76;white-space:nowrap}
#ins-fields{display:none;align-items:center;gap:14px;flex-wrap:wrap}
.if{display:flex;align-items:center;gap:4px;font-size:10px}
.if label{color:#5C6B76;white-space:nowrap}
.if input[type=range]{width:80px;accent-color:#5FAE9D;cursor:pointer}
.if input[type=number]{
  width:48px;background:#EEF0EA;border:1px solid #141B24;
  color:#141B24;padding:2px 4px;border-radius:3px;font-size:10px;
}
.iv{color:#5FAE9D;min-width:28px;font-size:10px}

/* Scrollbars */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#D8D0BA}
::-webkit-scrollbar-thumb{background:#141B24;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#7A8D9B}
</style>
</head>
<body>

<!-- ── Toolbar ─────────────────────────── -->
<div id="toolbar">
  <h1>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="80 75 138 90" class="logo-icon-svg">
      <g transform="translate(148,120) scale(78)">
        <rect x="-0.78" y="-0.48" width="1.55" height="0.96" rx="0.04" fill="#141B24"/>
        <rect x="-0.65" y="0.23" width="1.30" height="0.15" fill="#5FAE9D"/>
        <rect x="-0.65" y="-0.35" width="1.30" height="0.50" fill="#141B24"/>
        <circle cx="-0.26" cy="-0.10" r="0.15" fill="#5FAE9D"/>
        <circle cx="-0.26" cy="-0.10" r="0.05" fill="#141B24"/>
        <circle cx="-0.26" cy="-0.10" r="0.02" fill="#141B24"/>
        <circle cx="0.26" cy="-0.10" r="0.15" fill="#5FAE9D"/>
        <circle cx="0.26" cy="-0.10" r="0.09" fill="#141B24"/>
        <circle cx="0.26" cy="-0.10" r="0.02" fill="#141B24"/>
        <rect x="-0.09" y="-0.32" width="0.19" height="0.03" fill="#5FAE9D"/>
      </g>
    </svg>
    <span class="logo-text">
      <span class="logo-title">4TRACK</span>
      <span class="logo-sub">CASSETTE SAMPLER</span>
    </span>
  </h1>
  <div class="sep"></div>
  <button class="btn" id="btn-play">▶ 再生</button>
  <button class="btn" id="btn-stop">■ 停止</button>
  <button class="btn" id="btn-loop">⟳ ループ</button>
  <div class="sep"></div>
  <div id="metronome-box">
    <span class="mb-label">🔔 CLICK</span>
    <label class="metro-field"><span>BPM</span><input type="number" id="projectBpmInput" value="120" min="20" max="300"></label>
    <label class="metro-field"><span>拍子</span>
      <select id="beatsPerBarSelect">
        <option value="2">2拍</option>
        <option value="3">3拍</option>
        <option value="4" selected>4拍</option>
        <option value="5">5拍</option>
        <option value="6">6拍</option>
        <option value="7">7拍</option>
      </select>
    </label>
    <button class="btn" id="btn-click" type="button" title="メトロノームクリック(再生時のみ、書き出しには含まれません)">ON/OFF</button>
  </div>
  <div class="sep"></div>
  <button class="btn btn-green" id="btn-export">⬇ WAV書き出し</button>
  <div class="sep"></div>

  <div id="master-box">

<script>
'use strict';

// ════════════════════════════════════════════════════
// CONSTANTS
// ════════════════════════════════════════════════════
const TRACK_H  = 114;   // track row height (px) — must match .th{height} in CSS
const RULER_H  = 20;    // ruler height (px)
const NUM_TRK  = 4;     // fixed track count
const EDGE_PX  = 7;     // resize handle width (px) — reserved, clip move only for now

const TCOLORS = [
  '#FF7A29','#1CADA0','#F0B429','#3FA34D',
];
const SCOLORS = [
  '#FF7A29','#1CADA0','#F0B429','#3FA34D','#3A6EA5','#D94F3D','#8B5FA8','#E8A33D',
];

// ════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════
let _id = 0;
const uid = () => ++_id;

const S = {
  samples: [],   // {id, name, buffer, color}
  tracks: [],    // {id, name, volume, muted, solo, color, rec: {...}}
  clips: [],     // {id, sampleId, trackId, startTime, trimStart, trimEnd, volume, fadeIn, fadeOut}
  selSampleId: null,
  selClipId:   null,
  targetTrackId: null,
  wvSel: {x1:0, x2:0, has:false, drag:false},
  playing:  false,
  looping:  false,
  playCtxT: 0,   // audioCtx.currentTime at play start
  playOff:  0,   // playhead offset in seconds
  sources:  [],
  raf:      null,
  pps:      80,  // pixels per second
  drag:     null,// clip drag
  dropGhost:null,// library→timeline ghost
  previewSrc:null,
  masterVolume: 1,
  lofiOn: false,
  lofiAmount: 0.3,
  projectBpm: 120,
  beatsPerBar: 4,
  clickOn: false,
  masterEq: 'none',
};

// ════════════════════════════════════════════════════
// AUDIO CONTEXT
// ════════════════════════════════════════════════════
let _actx = null;
function getCtx(){
  if(!_actx) _actx = new (window.AudioContext||window.webkitAudioContext)();
  if(_actx.state==='suspended') _actx.resume();
  return _actx;
}

// ════════════════════════════════════════════════════
// TRACK INIT
// ════════════════════════════════════════════════════
function mkTrack(name, colorIdx){
  return {
    id:uid(), name, volume:1, pan:0, eq:'none', muted:false, solo:false,
    color: TCOLORS[colorIdx % TCOLORS.length],
    rec:{
      state:'idle',          // 'idle'|'armed'|'recording'
      mediaRecorder:null,
      chunks:[],
      stream:null,
      analyser:null,
      sourceNode:null,
      startPlayOff:0,
      startWallTime:0,
      animFrame:null,
    },
  };
}

function initTracks(){
  for(let i=0;i<NUM_TRK;i++) S.tracks.push(mkTrack(`TRACK ${i+1}`, i));
  S.targetTrackId = S.tracks[0].id;
}

// ════════════════════════════════════════════════════
// WAVEFORM CANVAS
// ════════════════════════════════════════════════════
const wvCanvas = document.getElementById('wv-canvas');
const wvCtx    = wvCanvas.getContext('2d');

function fitWvCanvas(){
  const c = document.getElementById('wv-container');
  wvCanvas.width  = Math.max(c.clientWidth,  1);
  wvCanvas.height = Math.max(c.clientHeight, 1);
  drawWv();
}

function drawWv(){
  const W=wvCanvas.width, H=wvCanvas.height, c=wvCtx;
  c.fillStyle='#22384C'; c.fillRect(0,0,W,H);
  const sample = S.samples.find(s=>s.id===S.selSampleId);
  if(!sample){
    c.fillStyle='#6E8494'; c.font='12px system-ui'; c.textAlign='center';
    c.fillText('← サンプルを選択してください', W/2, H/2); return;
  }
  // center line
  c.strokeStyle='rgba(0,212,170,.1)'; c.lineWidth=1;
  c.beginPath(); c.moveTo(0,H/2); c.lineTo(W,H/2); c.stroke();
  // selection
  if(S.wvSel.has||S.wvSel.drag){
    const sx=Math.min(S.wvSel.x1,S.wvSel.x2), sw=Math.abs(S.wvSel.x2-S.wvSel.x1);
    if(sw>1){
      c.fillStyle='rgba(255,107,53,.15)'; c.fillRect(sx,0,sw,H);
      c.strokeStyle='#5FAE9D'; c.lineWidth=1;
      c.beginPath(); c.moveTo(sx,0); c.lineTo(sx,H);
      c.moveTo(sx+sw,0); c.lineTo(sx+sw,H); c.stroke();
    }
  }
  // waveform
  const data=sample.buffer.getChannelData(0);
  const step=data.length/W;
  c.strokeStyle='#FFC670'; c.lineWidth=1; c.beginPath();
  for(let x=0;x<W;x++){
    let mn=1,mx=-1;
    const s0=Math.floor(x*step), s1=Math.floor((x+1)*step);
    for(let i=s0;i<s1;i++){const v=data[i]||0;if(v<mn)mn=v;if(v>mx)mx=v;}
    const y1=((1-mx)/2)*H, y2=((1-mn)/2)*H;
    if(x===0)c.moveTo(0,y1);
    c.lineTo(x,y1); c.lineTo(x,y2);
  }
  c.stroke();
}

let _wvDown=false;
wvCanvas.addEventListener('mousedown',e=>{
  if(!S.selSampleId) return;
  _wvDown=true;
  S.wvSel={x1:e.offsetX,x2:e.offsetX,has:false,drag:true};
  drawWv();
});
wvCanvas.addEventListener('mousemove',e=>{
  if(!_wvDown) return;
  S.wvSel.x2=e.offsetX; drawWv(); updateWvInfo();
});
wvCanvas.addEventListener('mouseup',e=>{
  _wvDown=false; S.wvSel.x2=e.offsetX; S.wvSel.drag=false;
  S.wvSel.has=Math.abs(S.wvSel.x2-S.wvSel.x1)>2;
  drawWv(); updateWvInfo(); updateAddBtns();
});
wvCanvas.addEventListener('mouseleave',()=>{
  if(_wvDown){ _wvDown=false; S.wvSel.drag=false; S.wvSel.has=Math.abs(S.wvSel.x2-S.wvSel.x1)>2; drawWv(); }
});

function selSecs(){
  const sample=S.samples.find(s=>s.id===S.selSampleId);
  if(!sample||!S.wvSel.has) return null;
  const W=wvCanvas.width, dur=sample.buffer.duration;
  const a=Math.min(S.wvSel.x1,S.wvSel.x2)/W*dur;
  const b=Math.max(S.wvSel.x1,S.wvSel.x2)/W*dur;
  return {start:a, end:b};
}

function updateWvInfo(){
  const sample=S.samples.find(s=>s.id===S.selSampleId);
  if(!sample){document.getElementById('wv-info').textContent='選択: — / 全体: —';return;}
  const sel=selSecs();
  const sr=sel?`${sel.start.toFixed(2)}s ~ ${sel.end.toFixed(2)}s (${(sel.end-sel.start).toFixed(2)}s)`:'—';
  document.getElementById('wv-info').textContent=`選択: ${sr}　/　全体: ${sample.buffer.duration.toFixed(2)} s`;
}

function updateAddBtns(){
  const has=!!S.selSampleId;
  const sel=selSecs(); const hasSel=sel&&(sel.end-sel.start)>0.005;
  document.getElementById('btn-add-sel').disabled=!hasSel;
  document.getElementById('btn-add-all').disabled=!has;
  document.getElementById('btn-sel-clear').disabled=!hasSel;
  document.getElementById('btn-wv-preview').disabled=!has;
  document.getElementById('btn-stretch').disabled=!has;
  document.getElementById('btn-monoize').disabled=!has;
}

document.getElementById('btn-sel-clear').addEventListener('click',()=>{
  S.wvSel={x1:0,x2:0,has:false,drag:false}; drawWv(); updateWvInfo(); updateAddBtns();
});

// ════════════════════════════════════════════════════
// TIMELINE CANVASES
// ════════════════════════════════════════════════════
const clipsScroll = document.getElementById('clips-scroll');
const tlCanvas    = document.getElementById('tl-canvas');
const tlCtx       = tlCanvas.getContext('2d');
const rulerCanvas = document.getElementById('ruler-canvas');
const rulerCtx    = rulerCanvas.getContext('2d');
const headersInner= document.getElementById('headers-inner');
const rulerScroll = document.getElementById('ruler-scroll');

function maxEndTime(){
  if(!S.clips.length) return 0;
  return Math.max(...S.clips.map(c=>c.startTime+(c.trimEnd-c.trimStart)));
}

function fitTimeline(){
  const minW = clipsScroll.clientWidth || 600;
  const W = Math.max(minW, maxEndTime()*S.pps + 400);
  const H = S.tracks.length * TRACK_H;
  tlCanvas.width=W; tlCanvas.height=H;
  rulerCanvas.width=W;
  drawTimeline();
}

// ── Timeline drawing ─────────────────────
function drawTimeline(){
  drawRuler();
  drawClipsCanvas();
}

function drawRuler(){
  const W=rulerCanvas.width, c=rulerCtx;
  c.clearRect(0,0,W,RULER_H);
  c.fillStyle='#1C2B3A'; c.fillRect(0,0,W,RULER_H);
  const ti = S.pps>=100?0.5:S.pps>=50?1:2;
  c.fillStyle='#9FB0BC'; c.font='9px system-ui'; c.textAlign='left';
  for(let t=0; t*S.pps<W+1; t+=ti){
    const x=Math.round(t*S.pps);
    c.strokeStyle='#3D5165'; c.lineWidth=1;
    c.beginPath(); c.moveTo(x, t%1===0?0:RULER_H-5); c.lineTo(x,RULER_H); c.stroke();
    if(t%1===0){
      const mm=Math.floor(t/60), ss=(t%60).toFixed(0).padStart(2,'0');
      c.fillText(mm>0?`${mm}:${ss}`:`${t}s`, x+2, RULER_H-1);
    }
  }
  // playhead on ruler
  const ph=playheadSecs();
  const px=ph*S.pps;
  c.fillStyle='#5FAE9D';
  c.beginPath(); c.moveTo(px-5,0); c.lineTo(px+5,0); c.lineTo(px,7); c.closePath(); c.fill();
}

function drawClipsCanvas(){
  const W=tlCanvas.width, H=tlCanvas.height, c=tlCtx;
  c.clearRect(0,0,W,H);

  // Track row backgrounds + separators
  S.tracks.forEach((tr,i)=>{
    const y=i*TRACK_H;
    c.fillStyle = i%2===0?'#22384C':'#2A415A';
    c.fillRect(0,y,W,TRACK_H);
    if(tr.muted && !tr.solo){
      c.fillStyle='rgba(0,0,0,.35)'; c.fillRect(0,y,W,TRACK_H);
    }
    // separator
    c.strokeStyle='#3D5165'; c.lineWidth=1;
    c.beginPath(); c.moveTo(0,y+TRACK_H-.5); c.lineTo(W,y+TRACK_H-.5); c.stroke();
  });

  // Vertical grid
  const ti=S.pps>=100?0.5:S.pps>=50?1:2;
  for(let t=0; t*S.pps<W; t+=ti){
    const x=Math.round(t*S.pps);
    c.strokeStyle=t%1===0?'rgba(48,54,61,.5)':'rgba(48,54,61,.25)';
    c.lineWidth=1; c.beginPath(); c.moveTo(x,0); c.lineTo(x,H); c.stroke();
  }

  // Detect solo
  const hasSolo=S.tracks.some(t=>t.solo);

  // Clips
  const draggingId=S.drag?.clipId;
  S.clips.forEach(clip=>{
    if(clip.id===draggingId&&S.drag?.phase==='drag') return;
    const tr=S.tracks.find(t=>t.id===clip.trackId); if(!tr) return;
    const trIdx=S.tracks.indexOf(tr);
    const sample=S.samples.find(s=>s.id===clip.sampleId); if(!sample) return;
    const cx=clip.startTime*S.pps;
    const cw=(clip.trimEnd-clip.trimStart)*S.pps;
    const cy=trIdx*TRACK_H;
    const dimmed=hasSolo&&!tr.solo||tr.muted;
    drawClipBlock(c,clip,sample,tr,cx,cy,cw,clip.id===S.selClipId,dimmed);
  });

  // Drop ghost (sample library drag)
  if(S.dropGhost){
    const g=S.dropGhost;
    const sample=S.samples.find(s=>s.id===g.sampleId);
    const tr=S.tracks[g.trackIdx];
    if(sample&&tr){
      const cw=sample.buffer.duration*S.pps;
      c.globalAlpha=.45;
      drawClipBlock(c,null,sample,tr,g.x,g.trackIdx*TRACK_H,cw,false,false);
      c.globalAlpha=1;
    }
  }

  // Drag ghost
  if(S.drag&&S.drag.phase==='drag'){
    const clip=S.clips.find(x=>x.id===S.drag.clipId);
    if(clip){
      const sample=S.samples.find(s=>s.id===clip.sampleId);
      const tr=S.tracks[S.drag.targetTrIdx];
      if(sample&&tr){
        const cw=(clip.trimEnd-clip.trimStart)*S.pps;
        c.globalAlpha=.5;
        drawClipBlock(c,clip,sample,tr,S.drag.ghostTime*S.pps,S.drag.targetTrIdx*TRACK_H,cw,true,false);
        c.globalAlpha=1;
      }
    }
  }

  // Playhead
  const ph=playheadSecs();
  const px=ph*S.pps;
  c.strokeStyle='#5FAE9D'; c.lineWidth=2;
  c.beginPath(); c.moveTo(px,0); c.lineTo(px,H); c.stroke();
}

function drawClipBlock(c,clip,sample,tr,cx,cy,cw,selected,dimmed){
  const h=TRACK_H-1;
  const col=sample.color;
  // bg
  c.fillStyle=selected?col:col+'77';
  c.fillRect(cx,cy,Math.max(cw,2),h);
  // border
  c.strokeStyle=selected?'#fff':col;
  c.lineWidth=selected?2:1;
  c.strokeRect(cx+.5,cy+.5,Math.max(cw,2)-1,h-1);
  if(cw>4){
    // mini waveform
    const buf=sample.buffer, ch0=buf.getChannelData(0);
    const s0=Math.floor((clip?clip.trimStart:0)/buf.duration*buf.length);
    const s1=Math.floor((clip?clip.trimEnd:buf.duration)/buf.duration*buf.length);
    const span=s1-s0, ww=Math.min(cw-2,1200);
    const step=span/ww;
    c.strokeStyle='rgba(255,255,255,.28)'; c.lineWidth=1;
    c.save(); c.beginPath(); c.rect(cx,cy,cw,h); c.clip(); c.beginPath();
    for(let px2=0;px2<ww;px2++){
      let mn=0,mx=0;
      const a=s0+Math.floor(px2*step), b=s0+Math.floor((px2+1)*step);
      for(let i=a;i<Math.min(b,s1);i++){const v=ch0[i]||0;if(v<mn)mn=v;if(v>mx)mx=v;}
      const midY=cy+h/2;
      c.moveTo(cx+1+px2,midY-mx*(h/2-2)); c.lineTo(cx+1+px2,midY-mn*(h/2-2));
    }
    c.stroke();
    // label
    if(cw>20){
      c.fillStyle='rgba(255,255,255,.85)'; c.font='bold 9px system-ui'; c.textAlign='left';
      c.fillText(sample.name.replace(/\.[^.]+$/,''), cx+4, cy+11);
    }
    c.restore();
    // fades
    if(clip&&clip.fadeIn>0){
      const fw=Math.min(clip.fadeIn*S.pps,cw);
      const g=c.createLinearGradient(cx,0,cx+fw,0);
      g.addColorStop(0,'rgba(0,0,0,.8)'); g.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=g; c.fillRect(cx,cy,fw,h);
    }
    if(clip&&clip.fadeOut>0){
      const fw=Math.min(clip.fadeOut*S.pps,cw);
      const g=c.createLinearGradient(cx+cw-fw,0,cx+cw,0);
      g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.8)');
      c.fillStyle=g; c.fillRect(cx+cw-fw,cy,fw,h);
    }
  }
  if(dimmed){ c.fillStyle='rgba(0,0,0,.4)'; c.fillRect(cx,cy,Math.max(cw,2),h); }
}

// ── Timeline mouse interaction ───────────
function findClipAt(canvasX, canvasY){
  const trIdx=Math.floor(canvasY/TRACK_H);
  if(trIdx<0||trIdx>=S.tracks.length) return null;
  const tr=S.tracks[trIdx];
  const time=canvasX/S.pps;
  for(let i=S.clips.length-1;i>=0;i--){
    const cl=S.clips[i];
    if(cl.trackId!==tr.id) continue;
    const dur=cl.trimEnd-cl.trimStart;
    if(time>=cl.startTime&&time<=cl.startTime+dur) return cl;
  }
  return null;
}

clipsScroll.addEventListener('mousedown',e=>{
  const x=e.offsetX+clipsScroll.scrollLeft;
  const y=e.offsetY+clipsScroll.scrollTop;
  // ruler click → seek
  if(e.offsetY<0){ S.playOff=Math.max(0,x/S.pps); if(S.playing)startPlayback(S.playOff); drawTimeline(); return; }
  const clip=findClipAt(x,y);
  if(clip){
    S.selClipId=clip.id;
    const grabOff=(x-clip.startTime*S.pps)/S.pps;
    S.drag={clipId:clip.id,grabOffTime:grabOff,phase:'down',
            ghostTime:clip.startTime,targetTrIdx:S.tracks.indexOf(S.tracks.find(t=>t.id===clip.trackId)),
            startX:x,startY:y};
    updateInspector(); drawTimeline();
  } else {
    S.selClipId=null; S.drag=null; updateInspector(); drawTimeline();
  }
});

document.addEventListener('mousemove',e=>{
  if(!S.drag) return;
  // get position relative to canvas
  const rect=clipsScroll.getBoundingClientRect();
  const x=e.clientX-rect.left+clipsScroll.scrollLeft;
  const y=e.clientY-rect.top +clipsScroll.scrollTop;
  const dx=Math.abs(x-S.drag.startX), dy=Math.abs(y-S.drag.startY);
  if(S.drag.phase==='down'&&(dx>4||dy>4)) S.drag.phase='drag';
  if(S.drag.phase==='drag'){
    S.drag.ghostTime=Math.max(0,(x/S.pps)-S.drag.grabOffTime);
    S.drag.targetTrIdx=Math.max(0,Math.min(S.tracks.length-1,Math.floor(y/TRACK_H)));
    drawClipsCanvas();
  }
});

document.addEventListener('mouseup',()=>{
  if(!S.drag) return;
  if(S.drag.phase==='drag'){
    const clip=S.clips.find(c=>c.id===S.drag.clipId);
    if(clip){
      pushUndo();
      clip.startTime=S.drag.ghostTime;
      clip.trackId=S.tracks[S.drag.targetTrIdx].id;
    }
    fitTimeline();
  }
  S.drag=null;
});

// Ruler click → seek
document.getElementById('ruler-scroll').addEventListener('click',e=>{
  const x=e.offsetX+rulerScroll.scrollLeft;
  S.playOff=Math.max(0,x/S.pps);
  if(S.playing) startPlayback(S.playOff);
  drawTimeline();
});

// Scroll sync
clipsScroll.addEventListener('scroll',()=>{
  rulerScroll.scrollLeft=clipsScroll.scrollLeft;
  headersInner.scrollTop=clipsScroll.scrollTop;
});

// Drag from library
clipsScroll.addEventListener('dragover',e=>{
  e.preventDefault();
  if(!window._dragSampleId) return;
  const rect=clipsScroll.getBoundingClientRect();
  const x=e.clientX-rect.left+clipsScroll.scrollLeft;
  const y=e.clientY-rect.top +clipsScroll.scrollTop;
  const trIdx=Math.max(0,Math.min(S.tracks.length-1,Math.floor(y/TRACK_H)));
  S.dropGhost={sampleId:window._dragSampleId, x:Math.max(0,x), trackIdx:trIdx};
  drawClipsCanvas();
});
clipsScroll.addEventListener('dragleave',()=>{ S.dropGhost=null; drawClipsCanvas(); });
clipsScroll.addEventListener('drop',e=>{
  e.preventDefault();
  const sId=parseInt(e.dataTransfer.getData('sampleId'));
  const sample=S.samples.find(s=>s.id===sId);
  S.dropGhost=null;
  if(!sample) return;
  const rect=clipsScroll.getBoundingClientRect();
  const x=e.clientX-rect.left+clipsScroll.scrollLeft;
  const y=e.clientY-rect.top +clipsScroll.scrollTop;
  const trIdx=Math.max(0,Math.min(S.tracks.length-1,Math.floor(y/TRACK_H)));
  const tr=S.tracks[trIdx];
  const startT=Math.max(0,x/S.pps);
  addClip(sample,tr.id,startT,0,sample.buffer.duration);

// MICROPHONE RECORDING
// ════════════════════════════════════════════════════
async function toggleRec(tId){
  const tr=S.tracks.find(t=>t.id===tId); if(!tr) return;
  if(tr.rec.state==='idle') await startRec(tId);
  else stopRec(tId);
}

async function startRec(tId){
  const tr=S.tracks.find(t=>t.id===tId); if(!tr) return;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    const ctx=getCtx();

    // Analyser for level meter
    const srcNode=ctx.createMediaStreamSource(stream);
    const analyser=ctx.createAnalyser();
    analyser.fftSize=256; analyser.smoothingTimeConstant=.7;
    srcNode.connect(analyser);

    // MediaRecorder
    const mimeType=
      MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':
      MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':
      MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')?'audio/ogg;codecs=opus':'';
    const mr=new MediaRecorder(stream, mimeType?{mimeType}:{});
    tr.rec.chunks=[];
    mr.ondataavailable=e=>{ if(e.data&&e.data.size>0) tr.rec.chunks.push(e.data); };
    mr.onstop=()=>finalizeRec(tId);
    mr.start(100);

    tr.rec.mediaRecorder=mr;
    tr.rec.stream=stream;
    tr.rec.analyser=analyser;
    tr.rec.sourceNode=srcNode;
    tr.rec.startPlayOff=S.playOff;
    tr.rec.startWallTime=Date.now();
    tr.rec.state='recording';

    refreshHeader(tId);
    startLevelMeter(tId);
    startRecTimer(tId);
    setStatus(`🔴 録音中: ${tr.name}`);
  } catch(err){
    setStatus('マイクアクセスエラー: '+err.message);
  }
}

function stopRec(tId){
  const tr=S.tracks.find(t=>t.id===tId); if(!tr||tr.rec.state==='idle') return;
  if(tr.rec.mediaRecorder&&tr.rec.mediaRecorder.state!=='inactive') tr.rec.mediaRecorder.stop();
  tr.rec.stream?.getTracks().forEach(t=>t.stop());
  tr.rec.sourceNode?.disconnect();
  if(tr.rec.animFrame){cancelAnimationFrame(tr.rec.animFrame);tr.rec.animFrame=null;}
  tr.rec.state='idle';
  stopLevelMeter(tId);
  stopRecTimer(tId);
  refreshHeader(tId);
}

async function finalizeRec(tId){
  const tr=S.tracks.find(t=>t.id===tId); if(!tr) return;
  if(!tr.rec.chunks.length){setStatus('録音データなし');return;}
  try{
    const blob=new Blob(tr.rec.chunks,{type:tr.rec.mediaRecorder?.mimeType||'audio/webm'});
    const ab=await blob.arrayBuffer();
    const ctx=getCtx();
    const buffer=await ctx.decodeAudioData(ab);
    const dur=buffer.duration;
    const name=`REC_${tr.name}_${new Date().toISOString().replace(/[:.]/g,'-').slice(11,19)}.wav`;
    const sample={id:uid(), name, buffer, color:SCOLORS[S.samples.length%SCOLORS.length]};
    S.samples.push(sample);
    renderSampleList();
    addClip(sample, tr.id, tr.rec.startPlayOff, 0, dur);
    setStatus(`録音完了: ${name} (${dur.toFixed(2)}s) → ${tr.name}`);
  } catch(err){
    setStatus('録音デコードエラー: '+err.message);
  }
  tr.rec.chunks=[];
}

// Level meter animation
function startLevelMeter(tId){
  const tr=S.tracks.find(t=>t.id===tId); if(!tr) return;
  const el=headersInner.querySelector(`[data-tid="${tId}"]`); if(!el) return;
  const levelFills=el.querySelectorAll('.th-level-fill');

  const buf=new Uint8Array(tr.rec.analyser.frequencyBinCount);
  function frame(){
    if(tr.rec.state!=='recording'){levelFills.forEach(f=>f.style.height='0%');return;}
    tr.rec.analyser.getByteTimeDomainData(buf);
    let rms=0;
    for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;rms+=v*v;}
    rms=Math.sqrt(rms/buf.length);
    const pct=Math.min(100,rms*400);
    levelFills.forEach(f=>f.style.height=pct+'%');
    tr.rec.animFrame=requestAnimationFrame(frame);
  }
  tr.rec.animFrame=requestAnimationFrame(frame);
}

function stopLevelMeter(tId){
  const el=headersInner.querySelector(`[data-tid="${tId}"]`); if(!el) return;
  el.querySelectorAll('.th-level-fill').forEach(f=>f.style.height='0%');
}

// Recording timer
let _recTimerMap={};
function startRecTimer(tId){
  const tr=S.tracks.find(t=>t.id===tId); if(!tr) return;
  const el=headersInner.querySelector(`[data-tid="${tId}"]`); if(!el) return;
  const recTimeEl=el.querySelector('.th-rec-time');
  recTimeEl.style.display='block';
  const t0=Date.now();
  _recTimerMap[tId]=setInterval(()=>{
    const d=(Date.now()-t0)/1000;
    const mm=String(Math.floor(d/60)).padStart(2,'0');
    const ss=String(Math.floor(d%60)).padStart(2,'0');
    const ms=String(Math.floor((d%1)*10));
    recTimeEl.textContent=`${mm}:${ss}.${ms}`;
  },100);
}
function stopRecTimer(tId){
  clearInterval(_recTimerMap[tId]);
  const el=headersInner.querySelector(`[data-tid="${tId}"]`); if(!el) return;
  const recTimeEl=el.querySelector('.th-rec-time');
  if(recTimeEl){recTimeEl.style.display='none';recTimeEl.textContent='';}
}

async function loadFiles(files){

function drawMiniWave(canvas,sample){
  const c=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
  c.fillStyle='#22384C';c.fillRect(0,0,W,H);
  const data=sample.buffer.getChannelData(0),step=data.length/W;
  c.strokeStyle=sample.color;c.lineWidth=1;c.beginPath();
  for(let x=0;x<W;x++){
    let mn=0,mx=0;
    const s=Math.floor(x*step),e=Math.floor((x+1)*step);
    for(let i=s;i<e;i++){const v=data[i]||0;if(v<mn)mn=v;if(v>mx)mx=v;}
    const mid=H/2;c.moveTo(x,mid-mx*(mid-1));c.lineTo(x,mid-mn*(mid-1));
  }
  c.stroke();
}

function selectSample(id){
  S.selSampleId=id;
  S.wvSel={x1:0,x2:0,has:false,drag:false};
  const sample=S.samples.find(s=>s.id===id);
  document.getElementById('wv-label').textContent=sample?sample.name:'';
  renderSampleList(); drawWv(); updateWvInfo(); updateAddBtns();
  if(sample) applyDetectedBpm(sample);
}

// Autocorrelation-based BPM estimate. Works well on clear rhythmic loops
// (drums, percussion); unreliable on ambient/tonal material — it's a
// starting guess for "元のBPM", not an authoritative reading. Cached on
// the sample so re-selecting it doesn't recompute.
function detectBpm(samples, sampleRate){
  const targetSr=11025;
  const factor=Math.max(1,Math.round(sampleRate/targetSr));
  const dsLen=Math.floor(samples.length/factor);
  if(dsLen<50) return 120;
  const ds=new Float32Array(dsLen);
  for(let i=0;i<dsLen;i++) ds[i]=samples[i*factor];
  const sr=sampleRate/factor;

  const frameSize=Math.round(sr*0.01);
  const numFrames=Math.floor(dsLen/frameSize);
  if(numFrames<20) return 120;
  const energy=new Float32Array(numFrames);
  for(let f=0;f<numFrames;f++){
    let sum=0; const start=f*frameSize;
    for(let i=0;i<frameSize;i++){ const v=ds[start+i]; sum+=v*v; }
    energy[f]=Math.sqrt(sum/frameSize);
  }
  const onset=new Float32Array(numFrames);
  for(let f=1;f<numFrames;f++) onset[f]=Math.max(0,energy[f]-energy[f-1]);

  const frameRate=sr/frameSize;
  const minLag=Math.max(1,Math.round(frameRate*60/200));
  const maxLag=Math.min(numFrames-1,Math.round(frameRate*60/50));
  if(maxLag<=minLag) return 120;

  const scoreCache={};
  function scoreLag(lag){
    if(scoreCache[lag]!==undefined) return scoreCache[lag];
    let score=0;
    for(let f=0; f+lag<numFrames; f++) score+=onset[f]*onset[f+lag];
    scoreCache[lag]=score;
    return score;
  }
  let bestLag=minLag, bestScore=-Infinity;
  for(let lag=minLag; lag<=maxLag; lag++){
    const score=scoreLag(lag);
    if(score>bestScore){ bestScore=score; bestLag=lag; }
  }
  let correctedLag=bestLag;
  for(const div of [2,3,4]){
    const candidate=Math.round(bestLag/div);
    if(candidate<minLag) continue;
    if(scoreLag(candidate)>=bestScore*0.65){ correctedLag=candidate; break; }
  }
  const bpm=(frameRate*60)/correctedLag;
  if(!Number.isFinite(bpm)||bpm<=0) return 120;
  return Math.max(50,Math.min(200,bpm));
}

function applyDetectedBpm(sample){
  if(sample.detectedBpm==null){
    sample.detectedBpm=detectBpm(sample.buffer.getChannelData(0), sample.buffer.sampleRate);
  }
  document.getElementById('stretchSrcBpm').value=Math.round(sample.detectedBpm);
}

document.getElementById('btn-add-sel').addEventListener('click',()=>{
  const sample=S.samples.find(s=>s.id===S.selSampleId);if(!sample)return;
  const sel=selSecs();if(!sel||(sel.end-sel.start)<0.005)return;
  const tr=S.tracks.find(t=>t.id===S.targetTrackId)||S.tracks[0];
  const startT=trackEndTime(tr.id);
  addClip(sample,tr.id,startT,sel.start,sel.end);
});
document.getElementById('btn-add-all').addEventListener('click',()=>{

  const tr=S.tracks.find(t=>t.id===S.targetTrackId)||S.tracks[0];
  const startT=trackEndTime(tr.id);

});

function trackEndTime(tId){
  const tClips=S.clips.filter(c=>c.trackId===tId);
  if(!tClips.length)return 0;
  return Math.max(...tClips.map(c=>c.startTime+(c.trimEnd-c.trimStart)));
}

let undoStack=[], redoStack=[];

// ════════════════════════════════════════════════════
// TIME STRETCH (WSOLA — tempo change without pitch change)
// Offline, one-shot: produces a new sample in the library. No real-time
// worklet / live tempo dragging — that's a much bigger feature.
// ════════════════════════════════════════════════════
function wsolaStretchChannel(input, ratio, sampleRate){
  const inputLength=input.length;
  const outputLength=Math.max(1,Math.round(inputLength*ratio));
  const windowSize=Math.max(64,Math.round(sampleRate*0.03)); // ~30ms grain
  const hopOut=Math.round(windowSize/2);                     // 50% overlap (Hann COLA)
  const hopIn=Math.max(1,Math.round(hopOut/ratio));          // analysis hop scaled by ratio
  const searchRadius=Math.max(1,Math.round(sampleRate*0.006)); // ~6ms alignment search

  const win=new Float32Array(windowSize);
  for(let i=0;i<windowSize;i++) win[i]=0.5-0.5*Math.cos((2*Math.PI*i)/(windowSize-1));

  const out=new Float32Array(outputLength+windowSize);
  let prevTail=null, outPos=0, idealIn=0;

  while(outPos<outputLength){
    let start=Math.round(idealIn);
    if(prevTail){
      let bestOffset=0, bestScore=-Infinity;
      const overlapLen=Math.min(hopOut,windowSize);
      for(let off=-searchRadius; off<=searchRadius; off++){
        const candStart=start+off;
        if(candStart<0||candStart+windowSize>inputLength) continue;
        let score=0;
        for(let k=0;k<overlapLen;k++) score+=input[candStart+k]*prevTail[k];
        if(score>bestScore){ bestScore=score; bestOffset=off; }
      }
      start=start+bestOffset;
    }
    start=Math.max(0,Math.min(inputLength-windowSize,start));
    for(let k=0;k<windowSize;k++) out[outPos+k]+=input[start+k]*win[k];
    const overlapLen=Math.min(hopOut,windowSize);
    prevTail=input.subarray(start+windowSize-overlapLen,start+windowSize);
    outPos+=hopOut;
    idealIn+=hopIn;
  }
  return out.subarray(0,outputLength);
}

function timeStretchBuffer(buffer, ratio, ctx){
  const outLength=Math.max(1,Math.round(buffer.length*ratio));
  const outBuffer=ctx.createBuffer(buffer.numberOfChannels,outLength,buffer.sampleRate);
  for(let ch=0; ch<buffer.numberOfChannels; ch++){
    outBuffer.copyToChannel(wsolaStretchChannel(buffer.getChannelData(ch),ratio,buffer.sampleRate),ch);
  }
  return outBuffer;
}

document.getElementById('btn-stretch').addEventListener('click',()=>{
  const sample=S.samples.find(s=>s.id===S.selSampleId); if(!sample) return;
  const srcBpm=parseFloat(document.getElementById('stretchSrcBpm').value);
  const dstBpm=parseFloat(document.getElementById('stretchDstBpm').value);
  if(!srcBpm||!dstBpm||srcBpm<=0||dstBpm<=0){ setStatus('BPMを正しく入力してください'); return; }
  const ratio=srcBpm/dstBpm; // output/input length: faster target BPM → shorter output
  setStatus('テンポ変更中…');
  try{

    const baseName=sample.name.replace(/\.[^.]+$/,'');
    const newSample={id:uid(), name:`${baseName}_${dstBpm}bpm.wav`, buffer:stretched, color:SCOLORS[S.samples.length%SCOLORS.length]};

  }catch(err){
    setStatus('テンポ変更に失敗しました: '+err.message);
  }
});

function monoizeBuffer(buffer, ctx){
  const len=buffer.length, nCh=buffer.numberOfChannels;
  const mono=new Float32Array(len);
  for(let ch=0; ch<nCh; ch++){
    const data=buffer.getChannelData(ch);
    for(let i=0;i<len;i++) mono[i]+=data[i];
  }
  let peak=0;
  for(let i=0;i<len;i++){ const a=Math.abs(mono[i]); if(a>peak) peak=a; }
  if(peak>1){ const g=1/peak; for(let i=0;i<len;i++) mono[i]*=g; }
  const outBuffer=ctx.createBuffer(2,len,buffer.sampleRate);
  outBuffer.copyToChannel(mono,0);
  outBuffer.copyToChannel(mono,1);
  return outBuffer;
}

// ════════════════════════════════════════════════════
// EQ PRESETS — 3-band (low shelf / mid peak / high shelf), fixed
// frequencies. Presets, not a parametric editor — pick a flavor, not knobs.
// Same builder used for tracks and master, live playback and export.
// ════════════════════════════════════════════════════
const EQ_PRESETS = {
  none:    {label:'NONE',    low:0,   mid:0,   high:0  },
  rock:    {label:'ROCK',    low:4,   mid:-2,  high:3  },
  pop:     {label:'POP',     low:2,   mid:2,   high:1  },
  jazz:    {label:'JAZZ',    low:3,   mid:1,   high:0.5},
  dance:   {label:'DANCE',   low:6,   mid:-3,  high:4  },
  classic: {label:'CLASSIC', low:2,   mid:0,   high:2  },
  hicut:   {label:'HI-CUT',  low:0,   mid:0,   high:-10},
  locut:   {label:'LO-CUT',  low:-10, mid:0,   high:0  },
  cheap:   {label:'CHEAP',   low:-6,  mid:3,   high:-6 },
};
function buildEqChain(ctx, presetKey){
  const p=EQ_PRESETS[presetKey]||EQ_PRESETS.none;
  const low=ctx.createBiquadFilter(); low.type='lowshelf'; low.frequency.value=100; low.gain.value=p.low;
  const mid=ctx.createBiquadFilter(); mid.type='peaking'; mid.frequency.value=1000; mid.Q.value=0.7; mid.gain.value=p.mid;
  const high=ctx.createBiquadFilter(); high.type='highshelf'; high.frequency.value=8000; high.gain.value=p.high;
  low.connect(mid); mid.connect(high);
  return {input:low, output:high};
}
function eqOptionsHtml(){
  return Object.keys(EQ_PRESETS).map(key=>`<option value="${key}">${EQ_PRESETS[key].label}</option>`).join('');
}

// ════════════════════════════════════════════════════
// MASTER LO-FI FX (tape saturation / rolloff / hiss / wow-flutter)
// One shared function builds the chain for both live playback and
// OfflineAudioContext export, so the two always sound identical.
// ════════════════════════════════════════════════════
function makeSatCurve(drive){
  const n=1024, curve=new Float32Array(n);
  const norm=Math.tanh(drive)||1;
  for(let i=0;i<n;i++){
    const x=(i/(n-1))*2-1;
    curve[i]=Math.tanh(x*drive)/norm;
  }
  return curve;
}
function makeNoiseBuffer(ctx){
  const len=ctx.sampleRate*2;
  const buf=ctx.createBuffer(1,len,ctx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<len;i++) data[i]=Math.random()*2-1;
  return buf;
}

// ── Metronome click (monitoring only — not included in WAV export) ──
let clickBufDown=null, clickBufBeat=null;
function makeClickBuffer(ctx, freq){
  const len=Math.round(ctx.sampleRate*0.03);
  const buf=ctx.createBuffer(1,len,ctx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<len;i++){
    const t=i/ctx.sampleRate;
    data[i]=Math.sin(2*Math.PI*freq*t)*Math.exp(-t*90);
  }
  return buf;
}
function getClickBuffer(ctx, isDownbeat){
  if(isDownbeat){ if(!clickBufDown) clickBufDown=makeClickBuffer(ctx,1600); return clickBufDown; }
  if(!clickBufBeat) clickBufBeat=makeClickBuffer(ctx,1000);
  return clickBufBeat;
}
// amount: 0..1. sourceSink: array to push started source/oscillator nodes into
// so the caller can stop() them later (S.sources for live playback).
// Wet/dry blended (never 100% wet) so the effect stays a light tape "color"
// instead of a saturation/limiter that inflates loudness — even at amount=1
// this should read as "warm cassette", not distortion.
function buildLofiChain(ctx, amount, sourceSink){
  const input=ctx.createGain();
  const dry=ctx.createGain();
  const wet=ctx.createGain();
  const wetMix=amount*0.5; // full knob = 50% wet / 50% dry blend, at most
  dry.gain.value=1-wetMix;
  wet.gain.value=wetMix;
  input.connect(dry);
  input.connect(wet);

  const shaper=ctx.createWaveShaper();
  shaper.curve=makeSatCurve(1+amount*1.4); // light drive — color, not distortion
  shaper.oversample='2x';
  const lowpass=ctx.createBiquadFilter();
  lowpass.type='lowpass';
  lowpass.frequency.value = 19000 - amount*11000; // 19kHz clean → ~8kHz at full amount
  const flutterDelay=ctx.createDelay(0.03);
  flutterDelay.delayTime.value=0.006;
  const flutterLFO=ctx.createOscillator();
  flutterLFO.frequency.value=1.1+amount*2.5; // slow wow/flutter wobble
  const flutterDepth=ctx.createGain();
  flutterDepth.gain.value=amount*0.0012; // sub-2ms depth: subtle, not warbly
  flutterLFO.connect(flutterDepth); flutterDepth.connect(flutterDelay.delayTime);
  flutterLFO.start();
  wet.connect(shaper); shaper.connect(lowpass); lowpass.connect(flutterDelay);

  const hissBuf=makeNoiseBuffer(ctx);
  const hissSrc=ctx.createBufferSource();
  hissSrc.buffer=hissBuf; hissSrc.loop=true;
  const hissFilter=ctx.createBiquadFilter();
  hissFilter.type='highpass'; hissFilter.frequency.value=2500;
  const hissGain=ctx.createGain();
  hissGain.gain.value=amount*0.006; // faint tape hiss, not noticeable static
  hissSrc.connect(hissFilter); hissFilter.connect(hissGain);
  hissSrc.start();

  const output=ctx.createGain();
  dry.connect(output);
  flutterDelay.connect(output);
  hissGain.connect(output);

  if(sourceSink){ sourceSink.push(hissSrc, flutterLFO); }
  return {input, output};
}

// ════════════════════════════════════════════════════
// PLAYBACK
// ════════════════════════════════════════════════════
function playheadSecs(){
  if(S.playing) return getCtx().currentTime-S.playCtxT+S.playOff;
  return S.playOff;
}

function stopPlayback(){
  S.sources.forEach(s=>{try{s.stop();}catch(_){}});
  S.sources=[];
  if(S.raf){cancelAnimationFrame(S.raf);S.raf=null;}
  S.playing=false;
  S.masterAnalyser=null;
  document.getElementById('btn-play').textContent='▶ 再生';
  document.getElementById('btn-play').classList.remove('active');
  S.tracks.forEach(tr=>{
    if(tr.rec.state==='recording') return;
    const el=headersInner.querySelector(`[data-tid="${tr.id}"]`);
    el&&el.querySelectorAll('.th-level-fill').forEach(f=>f.style.height='0%');
  });
  setMasterMeter(0); setClipLamp(false);
  drawTimeline();
}

function startPlayback(offset=0){
  stopPlayback();
  if(!S.clips.length) return;
  const ctx=getCtx();
  const now=ctx.currentTime;
  S.playCtxT=now; S.playOff=offset; S.playing=true;
  document.getElementById('btn-play').textContent='❚❚ 一時停止';
  document.getElementById('btn-play').classList.add('active');

  const hasSolo=S.tracks.some(t=>t.solo);
  const total=maxEndTime();

  // Master bus: track sum → master vol → (optional LO-FI) → analyser → destination
  const masterGain=ctx.createGain();
  masterGain.gain.value=S.masterVolume;
  const masterEqChain=buildEqChain(ctx, S.masterEq);
  const masterAnalyser=ctx.createAnalyser();
  masterAnalyser.fftSize=512;
  masterGain.connect(masterEqChain.input);
  if(S.lofiOn){
    const chain=buildLofiChain(ctx, S.lofiAmount, S.sources);
    masterEqChain.output.connect(chain.input);
    chain.output.connect(masterAnalyser);
  } else {
    masterEqChain.output.connect(masterAnalyser);
  }
  masterAnalyser.connect(ctx.destination);
  S.masterAnalyser=masterAnalyser;

  const trackEqChains=S.tracks.map(t=>buildEqChain(ctx, t.eq));
  const trackMeters=S.tracks.map((tr,i)=>{
    const chain=trackEqChains[i];
    chain.output.connect(masterGain);
    const splitter=ctx.createChannelSplitter(2);
    chain.output.connect(splitter);
    const analyserL=ctx.createAnalyser(); analyserL.fftSize=256; analyserL.smoothingTimeConstant=.7;
    const analyserR=ctx.createAnalyser(); analyserR.fftSize=256; analyserR.smoothingTimeConstant=.7;
    splitter.connect(analyserL,0); splitter.connect(analyserR,1);
    const el=headersInner.querySelector(`[data-tid="${tr.id}"]`);
    const fills=el&&el.querySelectorAll('.th-level-fill');
    return {
      trackId:tr.id, analyserL, analyserR,
      bufL:new Float32Array(analyserL.fftSize), bufR:new Float32Array(analyserR.fftSize),
      levelWrap:el&&el.querySelector('.th-level-wrap'),
      fillL:fills&&fills[0], fillR:fills&&fills[1],
    };
  });

  S.clips.forEach(clip=>{
    const tr=S.tracks.find(t=>t.id===clip.trackId);if(!tr) return;
    if(tr.muted&&!tr.solo) return;
    if(hasSolo&&!tr.solo) return;
    const sample=S.samples.find(s=>s.id===clip.sampleId);if(!sample) return;
    const clipDur=clip.trimEnd-clip.trimStart;
    const clipEnd=clip.startTime+clipDur;
    if(clipEnd<=offset) return; // already past

    const withinOff=Math.max(0,offset-clip.startTime);
    const remaining=clipDur-withinOff;
    const schedAt=now+Math.max(0,clip.startTime-offset);

    const trIdx=S.tracks.indexOf(tr);
    const src=ctx.createBufferSource();
    const gainNode=ctx.createGain();
    const trGain=ctx.createGain();
    const trPan=ctx.createStereoPanner();
    src.buffer=sample.buffer;
    src.connect(gainNode); gainNode.connect(trGain); trGain.connect(trPan); trPan.connect(trackEqChains[trIdx].input);
    trGain.gain.value=tr.volume;
    trPan.pan.value=tr.pan;

    const vol=clip.volume;
    if(clip.fadeIn>0&&withinOff<clip.fadeIn){
      const fd=Math.min(clip.fadeIn-withinOff,remaining);
      gainNode.gain.setValueAtTime(0.0001,schedAt);
      gainNode.gain.linearRampToValueAtTime(vol,schedAt+fd);
      if(fd<remaining) gainNode.gain.setValueAtTime(vol,schedAt+fd);
    } else {
      gainNode.gain.setValueAtTime(vol,schedAt);
    }
    if(clip.fadeOut>0){
      const foAt=schedAt+Math.max(0,remaining-clip.fadeOut);
      gainNode.gain.setValueAtTime(vol,foAt);
      gainNode.gain.linearRampToValueAtTime(0.0001,schedAt+remaining);
    }
    src.start(schedAt,clip.trimStart+withinOff,remaining);
    src.onended=()=>{S.sources=S.sources.filter(x=>x!==src);};
    S.sources.push(src);
  });

  if(S.clickOn && S.projectBpm>0){
    const secPerBeat=60/S.projectBpm;
    const clickGain=ctx.createGain();
    clickGain.gain.value=0.5;
    clickGain.connect(ctx.destination); // dry, bypasses master/LO-FI — a monitoring click, not part of the mix
    let beatIndex=Math.floor(offset/secPerBeat);
    for(; beatIndex*secPerBeat<=total; beatIndex++){
      const t=beatIndex*secPerBeat;
      if(t<offset) continue;
      const when=now+(t-offset);
      const src=ctx.createBufferSource();
      src.buffer=getClickBuffer(ctx, beatIndex%S.beatsPerBar===0);
      src.connect(clickGain);
      src.start(when);
      S.sources.push(src);
    }
  }

  const meterBuf=new Float32Array(masterAnalyser.fftSize);
  const tick=()=>{
    const elapsed=ctx.currentTime-S.playCtxT+S.playOff;
    drawTimeline();
    if(S.masterAnalyser){
      S.masterAnalyser.getFloatTimeDomainData(meterBuf);
      let peak=0, sumSq=0;
      for(let i=0;i<meterBuf.length;i++){ const v=meterBuf[i]; sumSq+=v*v; const a=Math.abs(v); if(a>peak)peak=a; }
      const rms=Math.sqrt(sumSq/meterBuf.length);
      setMasterMeter(rms);
      if(peak>=0.98){ S.clipLampOffAt=performance.now()+1200; }
      setClipLamp(S.clipLampOffAt && performance.now()<S.clipLampOffAt);
    }
    trackMeters.forEach(tm=>{
      if(!tm.fillL||!tm.fillR) return;
      const tr=S.tracks.find(t=>t.id===tm.trackId);
      if(tr&&tr.rec.state==='recording') return; // mic monitor owns this bar
      const rmsOf=(analyser,buf)=>{
        analyser.getFloatTimeDomainData(buf);
        let sumSq=0; for(let i=0;i<buf.length;i++){ const v=buf[i]; sumSq+=v*v; }
        return Math.sqrt(sumSq/buf.length);
      };
      tm.fillL.style.height=Math.min(100,rmsOf(tm.analyserL,tm.bufL)*400)+'%';
      tm.fillR.style.height=Math.min(100,rmsOf(tm.analyserR,tm.bufR)*400)+'%';
    });
    // auto-scroll playhead into view
    const phPx=elapsed*S.pps;
    if(phPx>clipsScroll.scrollLeft+clipsScroll.clientWidth-60)
      clipsScroll.scrollLeft=phPx-60;
    if(elapsed>=total){
      if(S.looping){startPlayback(0);return;}
      else{stopPlayback();S.playOff=0;drawTimeline();return;}
    }
    S.raf=requestAnimationFrame(tick);
  };
  S.raf=requestAnimationFrame(tick);
}

document.getElementById('btn-play').addEventListener('click',()=>{
  if(S.playing) stopPlayback(); else startPlayback(S.playOff);
});
document.getElementById('btn-stop').addEventListener('click',()=>{

function updateLofiKnobUI(){

  }
  function onUp(){ document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); }
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
});
updateLofiKnobUI();

// Preview
document.getElementById('btn-wv-preview').addEventListener('click',()=>{
  const sample=S.samples.find(s=>s.id===S.selSampleId);if(!sample)return;
  const ctx=getCtx();
  const sel=selSecs();
  const t0=sel&&(sel.end-sel.start)>0.005?sel.start:0;
  const t1=sel&&(sel.end-sel.start)>0.005?sel.end:sample.buffer.duration;
  if(S.previewSrc){try{S.previewSrc.stop();}catch(_){}}
  const src=ctx.createBufferSource();
  src.buffer=sample.buffer; src.connect(ctx.destination);
  src.start(0,t0,t1-t0); S.previewSrc=src;
});

// ════════════════════════════════════════════════════
// WAV EXPORT
// ════════════════════════════════════════════════════
document.getElementById('btn-export').addEventListener('click',async()=>{
  if(!S.clips.length){setStatus('エクスポートするクリップがありません');return;}
  setStatus('書き出し処理中…');
  const total=maxEndTime();
  if(total<=0){setStatus('クリップの長さが0です');return;}
  const sr=getCtx().sampleRate;
  try{
    const offCtx=new OfflineAudioContext(2,Math.ceil(total*sr),sr);
    const hasSolo=S.tracks.some(t=>t.solo);

    // Master bus: same topology as live playback (buildLofiChain), so
    // export always matches what was heard.
    const masterGain=offCtx.createGain();
    masterGain.gain.value=S.masterVolume;
    const masterEqChain=buildEqChain(offCtx, S.masterEq);
    masterGain.connect(masterEqChain.input);
    if(S.lofiOn){
      const chain=buildLofiChain(offCtx, S.lofiAmount, null);
      masterEqChain.output.connect(chain.input);
      chain.output.connect(offCtx.destination);
    } else {
      masterEqChain.output.connect(offCtx.destination);
    }

    // per-track gain+pan+EQ nodes
    const trGains={};
    S.tracks.forEach(tr=>{
      const g=offCtx.createGain();
      g.gain.value=tr.volume;
      const p=offCtx.createStereoPanner();
      p.pan.value=tr.pan;
      const eqChain=buildEqChain(offCtx, tr.eq);
      g.connect(p); p.connect(eqChain.input); eqChain.output.connect(masterGain);
      trGains[tr.id]=g;
    });

    for(const clip of S.clips){
      const tr=S.tracks.find(t=>t.id===clip.trackId);if(!tr)continue;
      if(tr.muted&&!tr.solo) continue;
      if(hasSolo&&!tr.solo) continue;
      const sample=S.samples.find(s=>s.id===clip.sampleId);if(!sample)continue;
      const clipDur=clip.trimEnd-clip.trimStart;
      const src=offCtx.createBufferSource();
      const gain=offCtx.createGain();
      src.buffer=sample.buffer;
      src.connect(gain); gain.connect(trGains[tr.id]);
      const vol=clip.volume;
      const absEnd=clip.startTime+clipDur;
      if(clip.fadeIn>0){
        gain.gain.setValueAtTime(0.0001,clip.startTime);
        gain.gain.linearRampToValueAtTime(vol,clip.startTime+Math.min(clip.fadeIn,clipDur));
        if(clip.fadeIn<clipDur) gain.gain.setValueAtTime(vol,clip.startTime+clip.fadeIn);
      } else {
        gain.gain.setValueAtTime(vol,clip.startTime);
      }
      if(clip.fadeOut>0){
        gain.gain.setValueAtTime(vol,Math.max(clip.startTime,absEnd-clip.fadeOut));
        gain.gain.linearRampToValueAtTime(0.0001,absEnd);
      }
      src.start(clip.startTime,clip.trimStart,clipDur);
    }

    const rendered=await offCtx.startRendering();
    const wav=encodeWav(rendered);
    const blob=new Blob([wav],{type:'audio/wav'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='output.wav'; a.click();
    URL.revokeObjectURL(url);
    setStatus(`書き出し完了: output.wav (${total.toFixed(2)}s, ${(wav.byteLength/1048576).toFixed(1)} MB)`);
  }catch(err){setStatus('書き出しエラー: '+err.message);}
});

function encodeWav(buf){
  const nCh=Math.min(buf.numberOfChannels,2),sr=buf.sampleRate;
  const bpch=2,blk=nCh*bpch,brt=sr*blk,dLen=buf.length*blk;
  const ab=new ArrayBuffer(44+dLen);const v=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');v.setUint32(4,36+dLen,true);ws(8,'WAVE');
  ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);
  v.setUint16(22,nCh,true);v.setUint32(24,sr,true);
  v.setUint32(28,brt,true);v.setUint16(32,blk,true);v.setUint16(34,16,true);
  ws(36,'data');v.setUint32(40,dLen,true);
  let off=44;
  for(let i=0;i<buf.length;i++){
    for(let ch=0;ch<nCh;ch++){
      const s=Math.max(-1,Math.min(1,buf.getChannelData(ch)[i]));
      v.setInt16(off,s<0?s*0x8000:s*0x7FFF,true);off+=2;
    }
  }
  return ab;
}

// ════════════════════════════════════════════════════
// ZOOM & CLEAR & KEYBOARD
// ════════════════════════════════════════════════════
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.contentEditable==='true') return;
  if(e.code==='Space'){e.preventDefault();if(S.playing)stopPlayback();else startPlayback(S.playOff);}
  if(e.code==='Escape'){stopPlayback();S.playOff=0;drawTimeline();}
  if((e.code==='Delete'||e.code==='Backspace')&&S.selClipId){
    pushUndo();
    S.clips=S.clips.filter(c=>c.id!==S.selClipId);
    S.selClipId=null;updateInspector();fitTimeline();
  }
  if((e.key==='='||e.key==='+')&&e.ctrlKey){e.preventDefault();zoomTimeline(1.4);}
  if(e.key==='-'&&e.ctrlKey){e.preventDefault();zoomTimeline(1/1.4);}
  if(e.key.toLowerCase()==='z'&&(e.ctrlKey||e.metaKey)&&!e.shiftKey){e.preventDefault();undo();}
  if(e.key.toLowerCase()==='z'&&(e.ctrlKey||e.metaKey)&&e.shiftKey){e.preventDefault();redo();}
  if(e.key.toLowerCase()==='y'&&(e.ctrlKey||e.metaKey)){e.preventDefault();redo();}
});

function zoomTimeline(factor){
  S.pps=Math.max(10,Math.min(1200,S.pps*factor));
  fitTimeline();
}
document.getElementById('zoomInButton').addEventListener('click',()=>zoomTimeline(1.4));
document.getElementById('zoomOutButton').addEventListener('click',()=>zoomTimeline(1/1.4));

// ════════════════════════════════════════════════════
// AUTOSAVE / RESTORE (IndexedDB) — survives a page refresh.
// Periodic snapshot every few seconds rather than hooking every single
// mutation site; audio is stored WAV-encoded (reusing encodeWav/decodeAudioData
// for a lossless round trip) since localStorage can't hold sample audio.
// ════════════════════════════════════════════════════
const AUTOSAVE_DB='sampler4track-autosave', AUTOSAVE_VERSION=1;
let _dbPromise=null;
function openAutosaveDb(){
  if(_dbPromise) return _dbPromise;
  _dbPromise=new Promise((resolve,reject)=>{
    const req=indexedDB.open(AUTOSAVE_DB, AUTOSAVE_VERSION);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains('samples')) db.createObjectStore('samples');
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
  return _dbPromise;
}
function idbPut(storeName,key,value){
  return openAutosaveDb().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(storeName,'readwrite');
    tx.objectStore(storeName).put(value,key);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  }));
}
function idbDelete(storeName,key){
  return openAutosaveDb().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(storeName,'readwrite');
    tx.objectStore(storeName).delete(key);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  }));
}
function idbGet(storeName,key){
  return openAutosaveDb().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(storeName,'readonly');
    const req=tx.objectStore(storeName).get(key);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  }));
}
function idbGetAll(storeName){
  return openAutosaveDb().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(storeName,'readonly');
    const store=tx.objectStore(storeName);
    const keysReq=store.getAllKeys(), valsReq=store.getAll();
    tx.oncomplete=()=>resolve({keys:keysReq.result, values:valsReq.result});
    tx.onerror=()=>reject(tx.error);
  }));
}

let savedSampleIds=new Set(); // which sample audio is already persisted — skip re-encoding unchanged buffers

async function doAutosave(){
  try{
    for(const sample of S.samples){
      if(savedSampleIds.has(sample.id)) continue;
      const wav=encodeWav(sample.buffer);
      await idbPut('samples', sample.id, {name:sample.name, color:sample.color, detectedBpm:sample.detectedBpm??null, wav});
      savedSampleIds.add(sample.id);
    }
    const currentIds=new Set(S.samples.map(s=>s.id));
    for(const id of Array.from(savedSampleIds)){
      if(!currentIds.has(id)){ savedSampleIds.delete(id); await idbDelete('samples', id); }
    }
    const meta={
      sampleOrder: S.samples.map(s=>s.id),
      tracks: S.tracks.map(t=>({id:t.id,name:t.name,volume:t.volume,pan:t.pan,eq:t.eq,muted:t.muted,solo:t.solo})),
      clips: S.clips.map(c=>({id:c.id,sampleId:c.sampleId,trackId:c.trackId,startTime:c.startTime,trimStart:c.trimStart,trimEnd:c.trimEnd,volume:c.volume,fadeIn:c.fadeIn,fadeOut:c.fadeOut})),
      targetTrackId: S.targetTrackId,
      masterVolume: S.masterVolume, lofiOn: S.lofiOn, lofiAmount: S.lofiAmount, projectBpm: S.projectBpm, beatsPerBar: S.beatsPerBar, masterEq: S.masterEq,
      nextUid: _id,
    };
    await idbPut('meta','project', meta);
  }catch(err){ console.error('autosave failed', err); }
}

async function restoreFromDb(){
  try{
    const meta=await idbGet('meta','project');
    if(!meta) return false;
    const ctx=getCtx();
    const {keys, values}=await idbGetAll('samples');
    const sampleMap={};
    for(let i=0;i<keys.length;i++){
      const rec=values[i];
      try{
        const audioBuf=await ctx.decodeAudioData(rec.wav.slice(0));
        sampleMap[keys[i]]={id:keys[i], name:rec.name, color:rec.color, buffer:audioBuf, detectedBpm:rec.detectedBpm??null};
        savedSampleIds.add(keys[i]);
      }catch(e){ console.error('failed to restore sample', keys[i], e); }
    }
    S.samples=(meta.sampleOrder||[]).map(id=>sampleMap[id]).filter(Boolean);

    if(meta.tracks){
      meta.tracks.forEach((t,i)=>{
        if(!S.tracks[i]) return;
        Object.assign(S.tracks[i], {name:t.name,volume:t.volume,pan:t.pan,eq:t.eq||'none',muted:t.muted,solo:t.solo});
      });
    }
    const validSampleIds=new Set(S.samples.map(s=>s.id));
    const validTrackIds=new Set(S.tracks.map(t=>t.id));
    S.clips=(meta.clips||[]).filter(c=>validSampleIds.has(c.sampleId)&&validTrackIds.has(c.trackId));
    S.targetTrackId=validTrackIds.has(meta.targetTrackId)?meta.targetTrackId:S.tracks[0].id;
    S.masterVolume=meta.masterVolume??1;
    S.lofiOn=!!meta.lofiOn;
    S.lofiAmount=meta.lofiAmount??0.3;
    S.projectBpm=meta.projectBpm??120;
    S.beatsPerBar=meta.beatsPerBar??4;
    S.masterEq=meta.masterEq||'none';
    if(meta.nextUid) _id=Math.max(_id, meta.nextUid);
    return S.samples.length>0 || S.clips.length>0;
  }catch(err){ console.error('restore failed', err); return false; }
}

async function clearProject(){
  stopPlayback();
  try{
    const db=await openAutosaveDb();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(['samples','meta'],'readwrite');
      tx.objectStore('samples').clear();
      tx.objectStore('meta').clear();
      tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
    });
  }catch(err){ console.error('clear project db failed', err); }

  S.samples=[]; S.clips=[]; S.selSampleId=null; S.selClipId=null;
  S.tracks=[]; initTracks();
  S.masterVolume=1; S.lofiOn=false; S.lofiAmount=0.3;
  S.projectBpm=120; S.beatsPerBar=4; S.clickOn=false; S.masterEq='none';
  savedSampleIds=new Set();
  undoStack=[]; redoStack=[];

  document.getElementById('master-vol').value=S.masterVolume;
  masterVolVal.textContent='100%';
  document.getElementById('lofi-on').checked=false;
  updateLofiKnobUI();
  document.getElementById('projectBpmInput').value=S.projectBpm;
  document.getElementById('beatsPerBarSelect').value=S.beatsPerBar;
  document.getElementById('btn-click').classList.remove('active');
  document.getElementById('master-eq').value=S.masterEq;

  renderSampleList(); renderHeaders(); updateWvInfo(); updateAddBtns();
  updateInspector(); refreshUndoButtons(); fitTimeline(); drawTimeline();
  setMasterMeter(0); setClipLamp(false);
  setStatus('プロジェクトを消去しました');
}
document.getElementById('btn-clear-project').addEventListener('click', ()=>{
  document.getElementById('clear-modal').style.display='flex';
});
document.getElementById('clear-modal-no').addEventListener('click', ()=>{
  document.getElementById('clear-modal').style.display='none';
});
document.getElementById('clear-modal-yes').addEventListener('click', async ()=>{
  document.getElementById('clear-modal').style.display='none';
  await clearProject();
});

// ════════════════════════════════════════════════════
function setStatus(m){document.getElementById('status').textContent=m;}

const ro=new ResizeObserver(()=>{fitWvCanvas();fitTimeline();});
ro.observe(document.getElementById('wv-container'));
ro.observe(clipsScroll);

// Init
initTracks();
restoreFromDb().then(restored=>{
  renderHeaders();
  renderSampleList();
  document.getElementById('master-vol').value=S.masterVolume;
  masterVolVal.textContent=Math.round(S.masterVolume*100)+'%';
  document.getElementById('lofi-on').checked=S.lofiOn;
  updateLofiKnobUI();
  document.getElementById('projectBpmInput').value=S.projectBpm;
  document.getElementById('beatsPerBarSelect').value=S.beatsPerBar;
  document.getElementById('master-eq').value=S.masterEq;
  const sel=document.getElementById('add-track-sel');
  if(sel) sel.value=S.targetTrackId;
  fitTimeline();
  if(restored) setStatus('前回の作業を復元しました');
});
setInterval(doAutosave, 3000);
requestAnimationFrame(()=>{fitWvCanvas();fitTimeline();});
</script>
