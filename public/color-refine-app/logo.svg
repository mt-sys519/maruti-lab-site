<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 112" role="img" aria-labelledby="title desc">
  <title id="title">COLOR RE:FINE</title>
  <desc id="desc">白黒写真が色彩を取り戻す瞬間を、レンズと絞りで表現したカラーリファインのロゴ</desc>

  <defs>
    <linearGradient id="brandText" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c98a61"/>
      <stop offset="0.48" stop-color="#a4573c"/>
      <stop offset="1" stop-color="#6e3929"/>
    </linearGradient>

    <linearGradient id="outerRing" x1="0.15" y1="0.08" x2="0.88" y2="0.94">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="0.55" stop-color="#ece5dc"/>
      <stop offset="1" stop-color="#cfc4b7"/>
    </linearGradient>

    <linearGradient id="monoBlade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9d7d2"/>
      <stop offset="1" stop-color="#626865"/>
    </linearGradient>

    <linearGradient id="warmBlade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efd9ad"/>
      <stop offset="0.52" stop-color="#c77f58"/>
      <stop offset="1" stop-color="#87432f"/>
    </linearGradient>

    <radialGradient id="glass" cx="35%" cy="28%" r="78%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#5e3025" stop-opacity="0.18"/>
    </radialGradient>

    <linearGradient id="center" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfa"/>
      <stop offset="1" stop-color="#eee5dc"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3d241b" flood-opacity="0.17"/>
    </filter>

    <filter id="softInset" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.3" result="blur"/>
      <feOffset dy="1" result="offset"/>
      <feComposite in="offset" in2="SourceAlpha" operator="out" result="inner"/>
      <feColorMatrix in="inner" type="matrix" values="0 0 0 0 0.27 0 0 0 0 0.18 0 0 0 0 0.14 0 0 0 .18 0"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <g transform="translate(8 8)" filter="url(#shadow)">
    <circle cx="48" cy="48" r="42" fill="url(#outerRing)"/>
    <circle cx="48" cy="48" r="39.2" fill="#f7f3ed" stroke="#ffffff" stroke-width="1.25"/>

    <!-- aperture: monochrome on the left, color on the right -->
    <path d="M48 10.5A37.5 37.5 0 0 0 15.5 29.2L34.2 39.8 48 31.8Z" fill="#d8d6d0"/>
    <path d="M15.5 29.2A37.5 37.5 0 0 0 15.5 66.8L34.2 56.2V39.8Z" fill="url(#monoBlade)"/>
    <path d="M15.5 66.8A37.5 37.5 0 0 0 48 85.5V64.2L34.2 56.2Z" fill="#aeb0ab"/>

    <path d="M48 10.5A37.5 37.5 0 0 1 80.5 29.2L61.8 39.8 48 31.8Z" fill="#edd7ab"/>
    <path d="M80.5 29.2A37.5 37.5 0 0 1 80.5 66.8L61.8 56.2V39.8Z" fill="url(#warmBlade)"/>
    <path d="M80.5 66.8A37.5 37.5 0 0 1 48 85.5V64.2L61.8 56.2Z" fill="#774132"/>

    <!-- seam suggesting restoration / transition -->
    <path d="M48 12.2V83.8" stroke="#fffdf9" stroke-opacity="0.62" stroke-width="1.2"/>
    <path d="M48.7 12.2V83.8" stroke="#6e3929" stroke-opacity="0.16" stroke-width="0.9"/>

    <!-- central lens -->
    <circle cx="48" cy="48" r="15.6" fill="url(#center)" stroke="#ffffff" stroke-width="1.3" filter="url(#softInset)"/>
    <circle cx="48" cy="48" r="10.7" fill="#faf7f2" stroke="#c9beb1" stroke-width="1"/>
    <circle cx="48" cy="48" r="5.2" fill="#7c4938"/>
    <circle cx="46.3" cy="46.1" r="1.8" fill="#ffffff" fill-opacity="0.76"/>

    <!-- subtle glass highlight -->
    <circle cx="48" cy="48" r="37.2" fill="url(#glass)"/>
    <path d="M23.8 28.4A31 31 0 0 1 48 17" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="48" cy="48" r="39.2" fill="none" stroke="#b9aa9a" stroke-opacity="0.58" stroke-width="1"/>
  </g>

  <text x="112" y="59.5" font-family="Inter, 'Noto Sans JP', Arial, sans-serif" font-size="48" font-weight="760" letter-spacing="1.75" fill="#1f1d1a">COLOR <tspan fill="url(#brandText)">RE:FINE</tspan></text>
  <text x="114" y="88" font-family="Inter, 'Noto Sans JP', Arial, sans-serif" font-size="14.5" font-weight="600" letter-spacing="3.05" fill="#746d64">AIで、思い出に色を。</text>
</svg>
