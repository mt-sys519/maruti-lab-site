<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>filmea（フィルミア）— 写真の色を選んで仕上げる無料ツール</title>
<meta name="description" content="手持ちの写真に101種類の色をあてて見比べ、気に入った色で保存できる無料のツール。写真はアップロードされず、端末の中だけで処理します。">
<link rel="canonical" href="https://marutilab.com/filmea/">
<meta name="theme-color" content="#f2eee6">
<meta property="og:type" content="website">
<meta property="og:title" content="filmea（フィルミア）— 写真の色を選んで仕上げる無料ツール">
<meta property="og:description" content="手持ちの写真に101種類の色をあてて見比べ、気に入った色で保存できる無料のツール。写真はアップロードされず、端末の中だけで処理します。">
<meta property="og:url" content="https://marutilab.com/filmea/">
<meta property="og:image" content="https://marutilab.com/filmea/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600&family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script>
  try { const t = localStorage.getItem('filmea-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
</head>
<body>
<header class="topbar">
  <div class="brand"><img class="mark" src="icon.svg" alt=""><span class="brand-name">filmea</span></div>
  <div class="top-actions">
    <button class="ib" id="btnTheme" title="明るい画面 / 暗い画面" aria-label="明るい画面 / 暗い画面">
      <svg viewBox="0 0 24 24" class="i-moon"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <svg viewBox="0 0 24 24" class="i-sun"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.8v2.2M12 19v2.2M2.8 12h2.2M19 12h2.2M5.5 5.5l1.5 1.5M17 17l1.5 1.5M5.5 18.5L7 17M17 7l1.5-1.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <label class="primary" for="photoInput" title="写真をひらく">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="10" r="1.8" fill="currentColor"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>写真をひらく</span>
    </label>
    <input type="file" id="photoInput" accept="image/*" hidden>
    <button class="ib ib-accent" id="btnSave" title="保存" aria-label="保存">
      <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19.5h14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>

<div class="workspace">
  <main class="viewport empty" id="viewport">
    <div class="start" id="start">
      <label class="mount" for="photoInput">
        <span class="mount-no">▸ 01</span>
        <span class="mount-win">
          <span class="mount-plus"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
          <b>OPEN PHOTO</b>
          <small>写真をえらぶ／ここにドロップ</small>
        </span>
        <span class="mount-name">FILMEA</span>
      </label>
      <p class="start-note">写真はアップロードされず、この端末の中だけで処理します</p>
      <div class="start-samples"><span>サンプルで試す</span><div id="emptySamples"></div></div>
    </div>
    <div class="samples" id="sampleBar"><span class="samples-label">サンプル</span></div>
    <div class="stage" id="stage">
      <canvas class="frame-art" id="frameArt" aria-hidden="true"></canvas>
      <div class="crop-box" id="cropBox">
      <div class="canvas-box" id="canvasBox">
        <canvas id="view"></canvas>
        <div class="split-line" id="splitLine"><div class="split-handle"><svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
        <div class="split-tag tag-before" id="tagBefore">元の色</div>
        <div class="split-tag tag-after" id="tagAfter">AFTER</div>
        <div class="look-label" id="lookLabel"><i></i><b></b><span></span></div>
        <div class="hold-flag" id="holdFlag">元の色</div>
        <div class="hint" id="hint">写真を長押しすると元の色</div>
      </div>
      </div>
      <canvas class="frame-art frame-over" id="frameOver" aria-hidden="true"></canvas>
      <div class="frame-caption" id="frameCaption"></div>
      <div class="frame-date" id="frameDate"></div>
    </div>

    <div class="dock">
      <button class="db" id="btnSplit" aria-label="左右で比べる" data-tip="左右で比べる">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 7a2 2 0 0 1 2-2H12v14H5.5a2 2 0 0 1-2-2z" fill="currentColor" opacity=".35"/><path d="M12 3v18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button class="db" id="btnHold" aria-label="押している間だけ元の色" data-tip="押している間だけ元の色（Space）">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
      </button>
      <span class="sep"></span>
      <label class="amount" data-tip="効き具合">
        <svg viewBox="0 0 24 24"><path d="M12 3.5c3 4 6 7 6 10.5a6 6 0 0 1-12 0c0-3.5 3-6.5 6-10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 20a6 6 0 0 0 6-6H6a6 6 0 0 0 6 6z" fill="currentColor" opacity=".45"/></svg>
        <input type="range" id="s-intensity" min="0" max="100" value="100" step="1" aria-label="効き具合">
        <span class="ctrl-val" id="v-intensity"></span>
      </label>
      <span class="sep"></span>
      <button class="db" id="btnHist" aria-label="ヒストグラム" data-tip="ヒストグラム">
        <svg viewBox="0 0 24 24"><path d="M4 19h16M6.5 19v-5M10 19V9M13.5 19v-7M17 19V6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <details class="hist-pop" id="infoSec"><summary></summary>
        <canvas id="hist" width="640" height="150"></canvas>
        <div class="hist-foot"><span class="mono" id="activeCode">--</span><span class="mono" id="resInfo">-- × --</span></div>
      </details>
    </div>

    <div class="drop-hint" id="dropHint"><div>写真、または .cube / HaldCLUT / .lut16 をここに</div></div>
    <div class="toast" id="toast"></div>
  </main>

  <aside class="panel">
    <div class="ptitle"><h2>LOOKS</h2><span id="lookCount"></span></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <p class="group-note" id="groupNote"></p>
    <div class="thumbs" id="thumbs"></div>

    <div class="rows">
      <details class="row" id="adjust">
        <summary>
          <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="10" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <span>明るさ・色温度・粒子</span><em id="adjustState">初期値</em>
        </summary>
        <div class="row-body">
          <div class="ctrl"><div class="ctrl-top"><span>明るさ</span><span class="ctrl-val" id="v-exposure"></span></div><input type="range" id="s-exposure" min="-200" max="200" value="0" step="5"></div>
          <div class="ctrl"><div class="ctrl-top"><span>色温度</span><span class="ctrl-val" id="v-wb"></span></div><input type="range" id="s-wb" class="wb" min="-100" max="100" value="0" step="1"></div>
          <div class="ctrl"><div class="ctrl-top"><span>フィルム粒子</span><span class="ctrl-val" id="v-grain"></span></div><input type="range" id="s-grain" min="0" max="100" value="0" step="1"></div>
          <div class="ctrl"><div class="ctrl-top"><span>周辺減光</span><span class="ctrl-val" id="v-vignette"></span></div><input type="range" id="s-vignette" min="0" max="100" value="0" step="1"></div>
          <button class="text-btn" id="btnReset">すべて初期値にもどす</button>
        </div>
      </details>
      <details class="row" id="exportSec">
        <summary>
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="7.5" y="7.5" width="9" height="8" fill="currentColor" opacity=".3"/></svg>
          <span>保存の大きさと枠</span><em id="frameState">元の大きさ</em>
        </summary>
        <div class="row-body">
          <p class="seg-label" id="sizeLabel">大きさ（長い辺）</p>
          <div class="seg" id="sizeSeg" role="radiogroup">
            <button data-v="0" class="on">元の大きさ</button><button data-v="2048">2048px</button><button data-v="1080">1080px</button>
          </div>
          <p class="seg-label">枠</p>
          <div class="seg" id="frameSeg" role="radiogroup">
            <button data-v="none" class="on">なし</button><button data-v="white">白</button><button data-v="dark">黒</button><button data-v="film">フィルム</button><button data-v="slide">スライド白</button><button data-v="slidecard">スライド紙</button>
          </div>
          <div class="ctrl" id="lightCtrl" hidden><div class="ctrl-top"><span>光の強さ</span><span class="ctrl-val" id="v-light"></span></div><input type="range" id="s-light" min="0" max="100" value="60" step="1"></div>
          <label class="check"><input type="checkbox" id="stampCheck" checked><span>枠に16桁の番号を入れる（撮影日時と色）</span></label>
          <label class="check"><input type="checkbox" id="captionCheck" checked><span>枠に色の番号を入れる</span></label>
        </div>
      </details>
      <details class="row" id="lutSec">
        <summary>
          <svg viewBox="0 0 24 24"><path d="M12 4v10m0 0l-4-4m4 4l4-4M5 18h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>手持ちの LUT を読み込む</span><em>.cube / .png</em>
        </summary>
        <div class="row-body">
          <label class="lut-drop" id="lutDrop">
            <input type="file" id="lutInput" accept=".cube,.png,.lut16" multiple hidden>
            <span>.cube / HaldCLUT .png / .lut16 を<br>ドロップ、またはタップして選ぶ</span>
          </label>
        </div>
      </details>
    </div>
    <!-- PR: the Rakuten widget, framed from /ads/rakuten.html as on the rest of the site (app/PrAds.tsx).
         Always the 300x250 size, which fits the 368px panel and phones alike. The box keeps its height
         while loading so nothing in the panel moves, and the block goes if the widget cannot load. -->
    <aside class="pr" id="pr" aria-label="広告">
      <p class="pr-k">PR</p>
      <div class="pr-w"></div>
    </aside>
    <script>(()=>{const a=document.getElementById('pr'),w=a.querySelector('.pr-w'),f=document.createElement('iframe');f.src='/ads/rakuten.html?s=300x250';f.width=300;f.height=250;f.title='楽天市場の広告';f.loading='lazy';f.addEventListener('adgone',()=>a.hidden=true);w.append(f)})()</script>
    <section class="credits" id="credits"></section>
    <nav class="info-links" aria-label="filmea について"><a href="guide/">使い方</a><a href="faq/">よくある質問</a><a href="licenses.html">ライセンス</a><a href="/privacy">プライバシーポリシー</a><a href="/">Maruti Lab</a></nav>
    <p class="pr-note">このページには広告（アフィリエイトリンク）が含まれます。</p>
  </aside>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
